name: Deploy Vite site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 의존성 캐싱으로 빌드 속도를 높입니다.
          cache: 'npm'
          # npm 패키지 파일 위치 지정
          cache-dependency-path: './myGame/package-lock.json' 

      - name: Install dependencies
        run: npm ci
        working-directory: ./myGame

      - name: Build project
        run: npm run build
        working-directory: ./myGame

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite가 빌드한 결과물 폴더(dist) 위치를 지정합니다.
          path: './myGame/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
